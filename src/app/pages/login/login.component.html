<div class="flex flex-col items-center justify-center min-h-screen bg-gray-100 p-4">
    <div class="w-full max-w-sm bg-white p-6 rounded-lg shadow">

        <img src="assets/img/logo.png" alt="logo_artisana" class="w-32 mx-auto mb-4">

        <form (ngSubmit)="login()" class="flex flex-col gap-4 justify-center items-center">
            <input type="email" placeholder="Correo" [(ngModel)]="correo" name="correo" required
                class="border px-4 p-2 rounded-full" />
            <input type="password" placeholder="Contraseña" [(ngModel)]="contrasena" name="contraseña" required
                class="border px-4 p-2 rounded-full" />
            <button type="submit" class="bg-primary text-white py-2 rounded-lg w-40 flex text-center justify-center">
                Iniciar sesión
            </button>
            <div *ngIf="error" class="text-red-500 text-sm">{{ error }}</div>
        </form>
    </div>
</div>
