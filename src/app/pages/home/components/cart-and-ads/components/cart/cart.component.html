<div class="relative bg-white rounded-xl shadow-md border p-6 lg:p-4 flex flex-col flex-1 h-full gap-4 w-full">

    <!-- Badge móvil -->
    <div class="cursor-pointer absolute -top-4 left-1/2 -translate-x-1/2 bg-primary text-white text-xs rounded-full py-2 px-4 flex items-center gap-2 lg:hidden z-10"
        (click)="mostrarCarrito = !mostrarCarrito">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
        </svg>
        <span class="font-semibold">
            Mi Carrito
        </span>
        <span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
            </svg>
        </span>
    </div>


    <!-- Header -->
    <div class="bg-primary text-white rounded-lg px-4 py-2 items-center justify-between hidden lg:inline-flex">
        <span class="font-semibold">Mi Carrito</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
        </svg>

    </div>

    <!-- Productos -->
    <div [ngClass]="{'hidden lg:inline-flex': !mostrarCarrito}" class="flex flex-1 flex-col gap-3 pt-1">
        <!-- Item -->
        <div class="border rounded-xl p-3 flex items-center gap-3">
            <img src="assets/img/bebida1.png" alt="Producto" class="w-10 h-10 xl:w-12 xl:h-12 rounded-md" />
            <div class="flex-1">
                <p class="text-xs xl:text-sm font-normal">Moka de menta</p>
                <p class="text-gray-600">$85.00</p>
            </div>
            <div class="flex items-center gap-3">
                <button class="bg-gray-200 px-2 py-1 rounded-full text-sm leading-none items-center">-</button>
                <span class="text-sm">1</span>
                <button class="bg-gray-200 px-2 py-1 rounded-full text-sm leading-none items-center">+</button>
            </div>
        </div>

        <!-- Repetir para más productos -->
        <div class="border rounded-xl p-3 flex items-center gap-3">
            <img src="assets/img/bebida1.png" alt="Producto" class="w-10 h-10 xl:w-12 xl:h-12 rounded-md" />
            <div class="flex-1">
                <p class="text-xs xl:text-sm font-normal">Moka de menta</p>
                <p class="text-gray-600">$85.00</p>
            </div>
            <div class="flex items-center gap-3">
                <button class="bg-gray-200 px-2 py-1 rounded-full text-sm leading-none items-center">-</button>
                <span class="text-sm">1</span>
                <button class="bg-gray-200 px-2 py-1 rounded-full text-sm leading-none items-center">+</button>
            </div>
        </div>
    </div>



    <!-- Footer -->
    <div class="flex items-center justify-between border rounded-lg bg-gray-300 px-4 py-2">
        <div class="flex flex-1 flex-col items-start gap-1 text-gray-600 text-xs">
            <span class="flex items-start gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                10 min aprox.
            </span>
            <span class="text-accent text-xl 2xl:text-xl font-bold">$15.00</span>
        </div>
        <div class="flex items-center 2xl:items-start">
            <button (click)="abrirCheckout()"
                class="bg-secondary text-white text-md px-4 py-2 rounded-full font-semibold">
                Continuar
            </button>
        </div>
    </div>
</div>
